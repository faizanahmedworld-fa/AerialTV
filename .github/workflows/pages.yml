# Publishes the web player (the web folder) to GitHub Pages on every push to main.
# That gives iPhone, iPad and Apple TV viewers a working address with no server to run:
# https://faizanahmedworld-fa.github.io/AerialTV/

name: Web player

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep the country list in step with the Android app
        run: cmp web/countries.json app/src/main/assets/countries.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
